name: Production smoke test

on:
  push:
    # Verify the deployment that follows each push, not just the daily sweep.
    branches: [main]
  schedule:
    # Every 6 hours. Keeps an eye on the deployed app without human input.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    name: Verify the live deployment
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deployment of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Vercel builds asynchronously, two to three minutes after the push.
          # Without this gate a push-triggered run would test the previous
          # deployment and pass without ever exercising the new code. Vercel
          # reports its result as a commit status named "Vercel".
          api="repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"
          for attempt in $(seq 1 60); do
            # The array may hold several "Vercel" entries for one commit, so take
            # the most recently updated one rather than trusting the order.
            state=$(gh api "$api" \
              --jq '[.statuses[] | select(.context == "Vercel")] | sort_by(.updated_at) | last | .state // "missing"')
            echo "attempt $attempt: Vercel status = $state"
            case "$state" in
              success)
                echo "Deployment for ${GITHUB_SHA} is ready."
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel deployment failed for ${GITHUB_SHA}."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Vercel deployment of ${GITHUB_SHA}."
          exit 1

      - name: Homepage responds
        run: |
          code=$(curl -s -o /tmp/home.html -w "%{http_code}" --max-time 30 https://check-safe-beryl.vercel.app/)
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "::error::Homepage returned $code"; exit 1; }
          grep -q "CheckSafe" /tmp/home.html || { echo "::error::Homepage content unexpected"; exit 1; }

      - name: Analysis endpoint validates input
        run: |
          # Empty body must be rejected with 400, not silently accepted.
          code=$(curl -s -o /tmp/empty.json -w "%{http_code}" --max-time 60 \
            -X POST https://check-safe-beryl.vercel.app/api/analyze \
            -H "Content-Type: application/json" -d '{}')
          echo "POST {} -> $code"
          [ "$code" = "400" ] || { echo "::error::Empty body returned $code, expected 400"; exit 1; }

      - name: Analysis endpoint answers a real message
        run: |
          response=$(curl -s --max-time 90 \
            -X POST https://check-safe-beryl.vercel.app/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"message":"Your parcel is held. Pay a 2.99 EUR fee at parcel-pay-secure.com within 24h or it is returned."}')

          echo "$response" | head -c 600
          echo

          # The response contract must hold even in degraded mode.
          for field in risk_level summary detected_traps recommended_actions reassurance official_safe_url; do
            echo "$response" | grep -q "\"$field\"" || {
              echo "::error::Response is missing the '$field' field."; exit 1; }
          done

          # Links in the message must come back defanged, so the UI can display
          # them without offering a clickable route to the attacker.
          if ! echo "$response" | grep -q '"defanged_text"'; then
            echo "::error::Response is missing the 'defanged_text' field."
            exit 1
          fi
          if echo "$response" | grep -q '"defanged_text":"[^"]*parcel-pay-secure\.com'; then
            echo "::error::The scam link was returned un-defanged."
            exit 1
          fi
          if ! echo "$response" | grep -q 'parcel-pay-secure\[\.\]com'; then
            echo "::error::The scam link was not defanged as expected."
            exit 1
          fi

          # A parcel-fee scam must not come back as "Low". This is the safety
          # property that matters: a confident wrong "safe" is the worst
          # possible failure for this product.
          if echo "$response" | grep -q '"risk_level":"Low"'; then
            echo "::error::A known parcel-fee scam was classified as Low risk."
            exit 1
          fi

          if echo "$response" | grep -q '"degraded":true'; then
            echo "::warning::Both providers were unavailable; answered in degraded mode."
          fi
          echo "Smoke test passed."

      - name: The four reference cases keep their verdict
        run: |
          # A false negative on a known scam is the worst failure this product
          # can have, so the two dangerous cases are asserted on every run.
          check() {
            label="$1"; payload="$2"; expect="$3"
            got=$(curl -s --max-time 90 \
              -X POST https://check-safe-beryl.vercel.app/api/analyze \
              -H "Content-Type: application/json" \
              -d "$payload" | sed -n 's/.*"risk_level":"\([^"]*\)".*/\1/p')
            echo "$label -> $got (expected $expect)"
            if [ "$got" != "$expect" ]; then
              echo "::error::$label returned '$got', expected '$expect'."
              exit 1
            fi
          }

          check "case 1 fake parcel" \
            '{"message":"DHL: Votre colis n a pas pu etre livre. Confirmez: https://bit.ly/xyz"}' \
            "Very dangerous"

          check "case 2 bank code" \
            '{"message":"Alerte Securite : Paiement suspect de 450EUR. Envoyez le code recu pour annuler."}' \
            "Very dangerous"

          check "case 3 emotional pressure" \
            '{"message":"Coucou c est moi, nouveau numero, mon tel est casse, depanne-moi de 50EUR urgent"}' \
            "Suspicious"

          check "case 4 legitimate" \
            '{"message":"Salut, n oublie pas le pain en rentrant ce soir. A tout a l heure !"}' \
            "Low"

      - name: Personal data is masked server-side
        run: |
          # The API is public, so the server must redact even when the caller
          # does not. This asserts the enforcement point, not just the UI.
          response=$(curl -s --max-time 90 \
            -X POST https://check-safe-beryl.vercel.app/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"message":"URGENT: a 480 EUR transaction was detected. Call +33 6 12 34 56 78 and confirm your 6-digit code."}')

          masked=$(echo "$response" | sed -n 's/.*"masked":\([0-9]*\).*/\1/p')
          echo "masked=$masked"

          if [ -z "$masked" ]; then
            echo "::error::The response has no 'masked' field in meta."
            exit 1
          fi
          if [ "$masked" -lt 2 ]; then
            echo "::error::Expected at least 2 masked items (phone and amount), got $masked."
            exit 1
          fi
          echo "Server-side redaction confirmed."
