name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values: the build must succeed without real secrets,
          # and this also guards against the app requiring a key at build time.
          GEMINI_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder

      - name: Check the system prompt is not shipped to the browser
        run: |
          # The system prompt must never reach the client bundle: it is sent
          # from the server on every request. This regressed once already.
          if grep -rq "You are an assistant specialised in digital safety" .next/static 2>/dev/null; then
            echo "::error::The system prompt leaked into the client bundle."
            exit 1
          fi
          echo "No system prompt in the client bundle."

      - name: Check the link pattern survived minification
        run: |
          # The bare-domain branch of the link pattern contains a `\b` word
          # boundary. A minifier can constant-fold a `new RegExp(...)` template
          # and double that escape, which silently disables bare-domain
          # detection in production while every unit test still passes on the
          # source. This regressed once, so we assert on the built server bundle
          # by evaluating its own pattern against a bare domain.
          node -e '
            const fs = require("fs");
            const bundle = fs.readFileSync(".next/server/app/api/analyze/route.js", "utf8");
            const start = bundle.indexOf("/(?:https?:");
            const end = start < 0 ? -1 : bundle.indexOf("/gi", start);
            if (start < 0 || end < 0) {
              console.error("::error::The link pattern is missing from the server bundle.");
              process.exit(1);
            }
            const pattern = eval(bundle.slice(start, end + 3));
            if (!pattern.test("evil-pay.top")) {
              console.error("::error::Bare-domain detection is broken in the server bundle.");
              process.exit(1);
            }
            console.log("Link pattern matches a bare domain in the server bundle.");
          '
